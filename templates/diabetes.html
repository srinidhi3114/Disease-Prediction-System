{% extends "base.html" %}
{% block content %}

<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <div class="card shadow-lg">
                <div class="card-header text-center">
                    <h4>🩸 Diabetes Prediction</h4>
                    <small>Enter patient clinical details</small>
                </div>

                <div class="card-body">
                    <form method="POST" action="/predict_diabetes">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Pregnancies</label>
                                <input type="number" name="pregnancies" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Glucose Level</label>
                                <input type="number" name="glucose" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Blood Pressure</label>
                                <input type="number" name="bp" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Skin Thickness</label>
                                <input type="number" name="skin" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Insulin</label>
                                <input type="number" name="insulin" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>BMI</label>
                                <input type="number" step="0.1" name="bmi" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Diabetes Pedigree Function</label>
                                <input type="number" step="0.01" name="dpf" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Age</label>
                                <input type="number" name="age" class="form-control" required>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                🔍 Predict Diabetes
                            </button>
                        </div>

                    </form>
                </div>

                <div class="card-footer text-center">
                    <a href="/dashboard" class="btn btn-outline-secondary">
                        ⬅ Back to Dashboard
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
