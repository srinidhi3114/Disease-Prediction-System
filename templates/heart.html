{% extends "base.html" %}

{% block content %}

<div class="content-area">

    <div class="card mb-4">
        <div class="card-header">
            ❤️ Heart Disease Prediction
        </div>

        <div class="card-body">

            <form action="/predict/heart" method="POST">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>Age</label>
                        <input type="number" name="age" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Sex</label>
                        <select name="sex" class="form-control">
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Chest Pain Type (0–3)</label>
                        <input type="number" name="cp" class="form-control" min="0" max="3" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Resting Blood Pressure</label>
                        <input type="number" name="trestbps" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Cholesterol</label>
                        <input type="number" name="chol" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Fasting Blood Sugar</label>
                        <select name="fbs" class="form-control">
                            <option value="1">Yes (>120 mg/dl)</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Rest ECG (0–2)</label>
                        <input type="number" name="restecg" class="form-control" min="0" max="2">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Max Heart Rate</label>
                        <input type="number" name="thalach" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Exercise Induced Angina</label>
                        <select name="exang" class="form-control">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Oldpeak</label>
                        <input type="number" step="0.1" name="oldpeak" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Slope (0–2)</label>
                        <input type="number" name="slope" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>CA (0–4)</label>
                        <input type="number" name="ca" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Thal (0–3)</label>
                        <input type="number" name="thal" class="form-control">
                    </div>

                </div>

                <div class="text-center mt-4">
                    <button class="btn btn-primary btn-lg">
                        🔍 Predict Heart Disease
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
